# Ember configuration. Values tuned on validation (E3) are frozen here before test scoring.
reservoir:
  n_qubits: 5
  window_days: 5          # L
  gamma: 1.5707963267948966   # pi/2
  seed: 7
  input_map: [w_k, isi, dd_km, bui, rh]   # qubit 0..4

data:
  min_hotspot_days: 10
  min_final_area_km2: 10.0
  isolation_km: 2.0       # drop detections with no other detection of the same fire within this distance
  forecast_from_day: 3    # first day_index used as a forecast origin
  max_masked_in_window: 2

leads: [1, 3]

splits:
  train: [2018, 2019, 2020, 2021]
  val: [2022]
  test: [2023]

readout:
  lambda_grid: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0, 10.0, 100.0]

hardware:
  backend: ibm_fez
  shots: 2000
  case_uid: 242981        # ZF015-23, Yellowknife
  case_dates: ["2023-08-10", "2023-08-20"]
